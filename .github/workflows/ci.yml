name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── vote (Python / Flask) ──────────────────────────────────────────────────
  test-vote:
    name: Test — vote (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: vote/requirements.txt

      - name: Install dependencies and linter
        run: pip install -r vote/requirements.txt flake8

      - name: Lint
        run: flake8 vote/app.py --max-line-length 120

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image (production stage)
        uses: docker/build-push-action@v5
        with:
          context: vote
          target: final
          push: false
          tags: vote:ci
          cache-from: type=gha,scope=vote
          cache-to: type=gha,scope=vote,mode=max

  # ── result (Node.js) ───────────────────────────────────────────────────────
  test-result:
    name: Test — result (Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: result/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: result

      - name: Audit for critical vulnerabilities
        run: npm audit --audit-level=critical
        working-directory: result
        continue-on-error: true

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: result
          push: false
          tags: result:ci
          cache-from: type=gha,scope=result
          cache-to: type=gha,scope=result,mode=max

  # ── worker (.NET) ──────────────────────────────────────────────────────────
  test-worker:
    name: Test — worker (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"

      - name: Restore
        run: dotnet restore
        working-directory: worker

      - name: Build
        run: dotnet build --no-restore -c Release
        working-directory: worker

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: worker
          push: false
          tags: worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

  # ── integration ────────────────────────────────────────────────────────────
  integration-test:
    name: Integration test
    runs-on: ubuntu-latest
    needs: [test-vote, test-result, test-worker]
    steps:
      - uses: actions/checkout@v4

      - name: Build and start all services
        run: docker compose up -d --build
        timeout-minutes: 10

      - name: Wait for vote to be ready
        run: |
          echo "Waiting for vote (port 8080)..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/ > /dev/null 2>&1; then
              echo "vote is ready"
              break
            fi
            echo "  attempt $i/30"
            sleep 5
          done
          curl -sf http://localhost:8080/ > /dev/null || { echo "vote never became ready"; exit 1; }

      - name: Wait for result to be ready
        run: |
          echo "Waiting for result (port 8081)..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/ > /dev/null 2>&1; then
              echo "result is ready"
              break
            fi
            echo "  attempt $i/30"
            sleep 5
          done
          curl -sf http://localhost:8081/ > /dev/null || { echo "result never became ready"; exit 1; }

      - name: Vote page serves correct content
        run: |
          body=$(curl -sf http://localhost:8080/)
          echo "$body" | grep -q "Cats" || { echo "FAIL: 'Cats' not found in vote page"; exit 1; }
          echo "$body" | grep -q "Dogs" || { echo "FAIL: 'Dogs' not found in vote page"; exit 1; }
          echo "Vote page content OK"

      - name: Cast a vote
        run: |
          curl -sf -X POST -d "vote=a" http://localhost:8080/
          echo "Vote submitted"

      - name: Allow worker time to process
        run: sleep 5

      - name: Result page serves correct content
        run: |
          body=$(curl -sf http://localhost:8081/)
          echo "$body" | grep -q "Cats" || { echo "FAIL: 'Cats' not found in result page"; exit 1; }
          echo "$body" | grep -q "Dogs" || { echo "FAIL: 'Dogs' not found in result page"; exit 1; }
          echo "Result page content OK"

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color
