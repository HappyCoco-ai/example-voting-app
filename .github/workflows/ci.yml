name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── vote (Python / Flask) ──────────────────────────────────────────────────
  vote:
    name: vote (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: vote/requirements.txt

      - name: Install dependencies and linter
        run: pip install -r vote/requirements.txt flake8

      - name: Lint
        run: flake8 vote/app.py --max-line-length 120

      - uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: vote
          target: final
          push: false
          tags: vote:ci
          cache-from: type=gha,scope=vote
          cache-to: type=gha,scope=vote,mode=max

  # ── result (Node.js) ───────────────────────────────────────────────────────
  result:
    name: result (Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: result/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: result

      - name: Audit for critical vulnerabilities
        run: npm audit --audit-level=critical
        working-directory: result
        continue-on-error: true

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: result
          push: false
          tags: result:ci
          cache-from: type=gha,scope=result
          cache-to: type=gha,scope=result,mode=max

  # ── worker (.NET) ──────────────────────────────────────────────────────────
  worker:
    name: worker (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore
        working-directory: worker

      - name: Build
        run: dotnet build --no-restore -c Release
        working-directory: worker

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: worker
          push: false
          tags: worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

  # ── end-to-end integration ─────────────────────────────────────────────────
  integration:
    name: integration (docker compose)
    runs-on: ubuntu-latest
    needs: [vote, result, worker]
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build
        timeout-minutes: 10

      - name: Wait for the vote app (8080)
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ > /dev/null 2>&1 && { echo "vote ready"; exit 0; }
            echo "  waiting for vote ($i/30)"; sleep 5
          done
          echo "vote never became ready"; exit 1

      - name: Wait for the result app (8081)
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081/ > /dev/null 2>&1 && { echo "result ready"; exit 0; }
            echo "  waiting for result ($i/30)"; sleep 5
          done
          echo "result never became ready"; exit 1

      - name: Vote page renders both options
        run: |
          body=$(curl -sf http://localhost:8080/)
          echo "$body" | grep -q "Cats" || { echo "FAIL: 'Cats' missing from vote page"; exit 1; }
          echo "$body" | grep -q "Dogs" || { echo "FAIL: 'Dogs' missing from vote page"; exit 1; }

      - name: Cast a vote and let the worker drain the queue
        run: |
          curl -sf -X POST -d "vote=a" http://localhost:8080/ > /dev/null
          echo "vote submitted"
          sleep 5

      - name: Result page renders both options
        run: |
          body=$(curl -sf http://localhost:8081/)
          echo "$body" | grep -q "Cats" || { echo "FAIL: 'Cats' missing from result page"; exit 1; }
          echo "$body" | grep -q "Dogs" || { echo "FAIL: 'Dogs' missing from result page"; exit 1; }

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
